worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream auth_service {
        server auth-service:8081;
    }
    upstream customer_service {
        server customer-service:8082;
    }
    upstream account_service {
        server account-service:8083;
    }
    upstream transaction_service {
        server transaction-service:8084;
    }
    upstream notification_service {
        server notification-service:8085;
    }
    upstream frontend_app {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # Health check endpoint for ALB Target Group
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Note: no trailing slash on the location match, and no path after
        # the upstream name in proxy_pass. This means nginx forwards the
        # ORIGINAL request URI unchanged to the upstream, so both
        # "/api/accounts" (bare POST to create a resource) and
        # "/api/accounts/123" (GET with an id) match correctly. A trailing
        # slash on the location (e.g. "/api/accounts/") only matches URIs
        # that literally have something after that slash, silently missing
        # bare POST/GET requests to the resource root and falling through
        # to the next location block instead.

        location /api/auth {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/customers {
            proxy_pass http://customer_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/accounts {
            proxy_pass http://account_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/transactions {
            proxy_pass http://transaction_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/notifications {
            proxy_pass http://notification_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://frontend_app/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
