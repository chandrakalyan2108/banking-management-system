name: Banking Management System CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.AWS_REGISTRY }}
  ECR_REPOSITORY: ${{ secrets.AWS_REPOSITORY }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
  DEPLOY_DIR: /opt/banking-management-system

jobs:
  # 1. CI - Unit tests and Docker builds for backend microservices
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - customer-service
          - account-service
          - transaction-service
          - notification-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        working-directory: ./${{ matrix.service }}
        run: mvn -B clean test

      - name: Build Docker image
        working-directory: ./${{ matrix.service }}
        run: docker build -t ${{ matrix.service }}:${{ github.sha }} .

  # 2. CI - Build & test React frontend
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run tests
        working-directory: ./frontend
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Build frontend Docker image
        working-directory: ./frontend
        run: docker build -t frontend:${{ github.sha }} .

  # 3. Push Docker images to Amazon ECR
  push-to-ecr:
    needs: [build-and-test, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - customer-service
          - account-service
          - transaction-service
          - notification-service
          - frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        working-directory: ./${{ matrix.service }}
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-${{ github.sha }} -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-latest .
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-latest
  # 4. Deploy to EC2
  deploy-to-ec2:
    needs: push-to-ecr
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get ECR login token
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up SSH key
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Ensure deploy directory exists on EC2
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $USER@$HOST \
            "sudo mkdir -p ${{ env.DEPLOY_DIR }} && sudo chown -R \$(whoami):\$(whoami) ${{ env.DEPLOY_DIR }}"
      - name: Copy docker-compose.yml to EC2
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USERNAME }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            docker-compose.yml $USER@$HOST:${{ env.DEPLOY_DIR }}/docker-compose.yml
      - name: Copy .env file to EC2
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USERNAME }}
        run: |
          if [ -f .env ]; then
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              .env $USER@$HOST:${{ env.DEPLOY_DIR }}/.env
          else
            echo "Warning: .env file not found in repository"
          fi
      - name: Deploy using SSH
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USERNAME }}
          REGISTRY: ${{ env.ECR_REGISTRY }}
          REPOSITORY: ${{ env.ECR_REPOSITORY }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $USER@$HOST bash << 'DEPLOY_SCRIPT'
            set -e
            echo "Starting deployment process..."
            export DEBIAN_FRONTEND=noninteractive
            # Install dependencies
            if command -v apt-get &> /dev/null; then
              sudo apt-get update -qq || true
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl unzip 2>/dev/null || true
            fi
            # Install AWS CLI v2 if missing
            if ! command -v aws &> /dev/null; then
              echo "Installing AWS CLI v2..."
              cd /tmp
              curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
              unzip -q awscliv2.zip
              sudo ./aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update
              rm -rf awscliv2.zip aws
            fi
            # Verify AWS credentials
            aws sts get-caller-identity || { echo "AWS credentials invalid"; exit 1; }
            echo "Logging in to Amazon ECR..."
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
            echo "Pulling latest Docker images from ECR..."
            for svc in auth-service customer-service account-service transaction-service notification-service frontend; do
              docker pull "$REGISTRY/$REPOSITORY:${svc}-latest" || true
            done
            # Navigate to deployment directory
            if [ ! -f "$DEPLOY_DIR/docker-compose.yml" ]; then
              echo "Error: $DEPLOY_DIR/docker-compose.yml not found. Did the copy step run?"
              exit 1
            fi
            cd "$DEPLOY_DIR"
            # Stop existing containers
            echo "Stopping existing containers..."
            docker compose down || true
            # Backup original file
            cp docker-compose.yml docker-compose.yml.backup
            # Update image references
            echo "Updating docker-compose.yml with new image tags..."
            sed -i "s|image: .*auth-service:.*|image: $REGISTRY/$REPOSITORY:auth-service-latest|g" docker-compose.yml
            sed -i "s|image: .*customer-service:.*|image: $REGISTRY/$REPOSITORY:customer-service-latest|g" docker-compose.yml
            sed -i "s|image: .*account-service:.*|image: $REGISTRY/$REPOSITORY:account-service-latest|g" docker-compose.yml
            sed -i "s|image: .*transaction-service:.*|image: $REGISTRY/$REPOSITORY:transaction-service-latest|g" docker-compose.yml
            sed -i "s|image: .*notification-service:.*|image: $REGISTRY/$REPOSITORY:notification-service-latest|g" docker-compose.yml
            sed -i "s|image: .*frontend:.*|image: $REGISTRY/$REPOSITORY:frontend-latest|g" docker-compose.yml
            # Load environment variables if .env exists
            if [ -f "$DEPLOY_DIR/.env" ]; then
              echo "Loading environment variables from .env..."
              set -a
              source "$DEPLOY_DIR/.env"
              set +a
            fi
            # Start new containers
            echo "Starting new containers..."
            docker compose -f "$DEPLOY_DIR/docker-compose.yml" up -d
            echo "Deployment completed successfully"
          DEPLOY_SCRIPT
  # 5. Verify Deployment
  verify-deployment:
    needs: deploy-to-ec2
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify services health
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USERNAME }}
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $USER@$HOST << 'VERIFY_SCRIPT'
            set -e
            echo "=========================================="
            echo "Starting Deployment Verification"
            echo "=========================================="
            echo "Waiting for services to be ready..."
            sleep 15
            echo ""
            echo "Checking running containers..."
            docker ps --filter "status=running" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            services=("auth-service" "customer-service" "account-service" "transaction-service" "notification-service")
            echo ""
            echo "Checking backend services..."
            for service in "${services[@]}"; do
              if docker ps --filter "name=$service" --filter "status=running" | grep -q $service; then
                echo "✓ $service is running"
              else
                echo "✗ $service is NOT running"
                docker ps -a | grep $service || true
                exit 1
              fi
            done
            echo ""
            echo "Checking frontend service..."
            if docker ps --filter "name=frontend" --filter "status=running" | grep -q frontend; then
              echo "✓ Frontend is running"
            else
              echo "✗ Frontend is NOT running"
              docker ps -a | grep frontend || true
              exit 1
            fi
            echo ""
            echo "Checking API endpoint health..."
            API_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80/health 2>/dev/null || echo "000")
            if [ "$API_HEALTH" == "200" ]; then
              echo "✓ API is responding with health status 200"
            else
              echo "⚠ API responded with status: $API_HEALTH"
            fi
            echo ""
            echo "Checking frontend endpoint..."
            FRONTEND_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null || echo "000")
            if [ "$FRONTEND_HEALTH" == "200" ]; then
              echo "✓ Frontend is responding with status 200"
            else
              echo "⚠ Frontend responded with status: $FRONTEND_HEALTH"
            fi
            echo ""
            echo "Recent container logs summary:"
            docker ps --format "table {{.Names}}" | tail -n +2 | while read container; do
              echo "  - $container: $(docker logs --tail 1 $container 2>/dev/null | head -c 80)"
            done
            echo ""
            echo "=========================================="
            echo "✓ Deployment verification completed successfully"
            echo "=========================================="
          VERIFY_SCRIPT
      - name: Generate deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed to** | ${{ secrets.EC2_HOST }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **AWS Region** | ${{ secrets.AWS_REGION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **ECR Repository** | ${{ secrets.AWS_REGISTRY }}/${{ secrets.AWS_REPOSITORY }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Services Deployed** | auth-service, customer-service, account-service, transaction-service, notification-service, frontend |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployment Status** | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Services" >> $GITHUB_STEP_SUMMARY
          echo "- auth-service" >> $GITHUB_STEP_SUMMARY
          echo "- customer-service" >> $GITHUB_STEP_SUMMARY
          echo "- account-service" >> $GITHUB_STEP_SUMMARY
          echo "- transaction-service" >> $GITHUB_STEP_SUMMARY
          echo "- notification-service" >> $GITHUB_STEP_SUMMARY
          echo "- frontend" >> $GITHUB_STEP_SUMMARY
