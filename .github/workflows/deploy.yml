name: Banking Management System CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.AWS_REGISTRY }}
  ECR_REPOSITORY: ${{ secrets.AWS_REPOSITORY }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USERNAME: ${{ secrets.EC2_USERNAME }}

jobs:
  # 1. CI - Unit tests and Docker builds for backend microservices
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - customer-service
          - account-service
          - transaction-service
          - notification-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        working-directory: ./${{ matrix.service }}
        run: mvn -B clean test

      - name: Build Docker image
        working-directory: ./${{ matrix.service }}
        run: docker build -t ${{ matrix.service }}:${{ github.sha }} .

  # 2. CI - Build & test React frontend
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run tests
        working-directory: ./frontend
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Build frontend Docker image
        working-directory: ./frontend
        run: docker build -t frontend:${{ github.sha }} .

  # 3. Push Docker images to Amazon ECR
  push-to-ecr:
    needs: [build-and-test, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - customer-service
          - account-service
          - transaction-service
          - notification-service
          - frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        working-directory: ./${{ matrix.service }}
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-${{ github.sha }} -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-latest .
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-latest

  # 4. Deploy to EC2
  deploy-to-ec2:
    needs: push-to-ecr
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get ECR login token
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy using SSH
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USERNAME }}
          REGISTRY: ${{ env.ECR_REGISTRY }}
          REPOSITORY: ${{ env.ECR_REPOSITORY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Deploy script
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $USER@$HOST bash << 'DEPLOY_SCRIPT'
            set -e
            
            echo "Starting deployment process..."
            
            export DEBIAN_FRONTEND=noninteractive
            
            # Install dependencies
            echo "Installing required dependencies..."
            if command -v apt-get &> /dev/null; then
              sudo apt-get update -qq || true
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl unzip 2>/dev/null || true
            fi
            
            # Install AWS CLI v2 if not already installed
            if ! command -v aws &> /dev/null; then
              echo "AWS CLI not found. Installing AWS CLI v2..."
              cd /tmp
              curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip" || { echo "Error: Failed to download AWS CLI"; exit 1; }
              if command -v unzip &> /dev/null; then
                unzip -q awscliv2.zip
              else
                sudo DEBIAN_FRONTEND=noninteractive apt-get install -y unzip 2>&1 | tail -5
                unzip -q awscliv2.zip
              fi
              sudo ./aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update 2>&1 | grep -E "^(Installing|Uninstalling|Found|You)" || true
              rm -rf awscliv2.zip aws
              echo "AWS CLI v2 installed: $(aws --version)"
            else
              echo "AWS CLI already installed: $(aws --version)"
            fi
            
            # Configure AWS credentials
            export AWS_REGION=${{ secrets.AWS_REGION }}
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            
            echo "Verifying AWS CLI access..."
            aws sts get-caller-identity || { echo "Error: AWS credentials failed"; exit 1; }
            
            # Login to ECR
            echo "Logging in to Amazon ECR..."
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }} || { echo "Error: ECR login failed"; exit 1; }
            
            # Setup deployment directory
            echo "Setting up deployment directory..."
            DEPLOY_DIR="/home/ubuntu/banking-deployment"
            mkdir -p "$DEPLOY_DIR"
            
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "Error: Failed to create $DEPLOY_DIR"
              exit 1
            fi
            
            echo "Deployment directory ready: $DEPLOY_DIR"
            
            # Pull latest images
            echo "Pulling latest Docker images from ECR..."
            docker pull ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:auth-service-latest || true
            docker pull ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:customer-service-latest || true
            docker pull ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:account-service-latest || true
            docker pull ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:transaction-service-latest || true
            docker pull ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:notification-service-latest || true
            docker pull ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:frontend-latest || true
            
            # Stop existing containers
            echo "Stopping existing containers..."
            if [ -f "$DEPLOY_DIR/docker-compose.yml" ]; then
              cd "$DEPLOY_DIR"
              docker-compose down || true
            fi
            
            # Generate docker-compose.yml
            echo "Creating docker-compose.yml..."
            cat > "$DEPLOY_DIR/docker-compose.yml" << 'COMPOSE_EOF'
version: '3.8'

services:
  auth-service:
    image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:auth-service-latest
    container_name: auth-service
    ports:
      - "8001:8001"
    environment:
      - SPRING_APPLICATION_NAME=auth-service
    networks:
      - banking-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  customer-service:
    image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:customer-service-latest
    container_name: customer-service
    ports:
      - "8002:8002"
    environment:
      - SPRING_APPLICATION_NAME=customer-service
    networks:
      - banking-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  account-service:
    image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:account-service-latest
    container_name: account-service
    ports:
      - "8003:8003"
    environment:
      - SPRING_APPLICATION_NAME=account-service
    networks:
      - banking-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  transaction-service:
    image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:transaction-service-latest
    container_name: transaction-service
    ports:
      - "8004:8004"
    environment:
      - SPRING_APPLICATION_NAME=transaction-service
    networks:
      - banking-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  notification-service:
    image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:notification-service-latest
    container_name: notification-service
    ports:
      - "8005:8005"
    environment:
      - SPRING_APPLICATION_NAME=notification-service
    networks:
      - banking-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:frontend-latest
    container_name: frontend
    ports:
      - "3000:3000"
    networks:
      - banking-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  banking-network:
    driver: bridge
COMPOSE_EOF
            
            # Backup if file existed
            if [ -f "$DEPLOY_DIR/docker-compose.yml.backup" ]; then
              mv "$DEPLOY_DIR/docker-compose.yml" "$DEPLOY_DIR/docker-compose.yml.backup"
            fi
            
            echo "Starting new containers..."
            cd "$DEPLOY_DIR"
            docker-compose up -d
            
            echo "Deployment completed successfully"
          DEPLOY_SCRIPT

  # 5. Verify Deployment
  verify-deployment:
    needs: deploy-to-ec2
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify services health
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USERNAME }}
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $USER@$HOST << 'VERIFY_SCRIPT'
            set -e
            
            echo "=========================================="
            echo "Starting Deployment Verification"
            echo "=========================================="
            
            sleep 15
            
            echo ""
            echo "Checking running containers..."
            docker ps --filter "status=running" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            
            services=("auth-service" "customer-service" "account-service" "transaction-service" "notification-service")
            
            echo ""
            echo "Checking backend services..."
            for service in "${services[@]}"; do
              if docker ps --filter "name=$service" --filter "status=running" | grep -q $service; then
                echo "✓ $service is running"
              else
                echo "✗ $service is NOT running"
                docker ps -a | grep $service || true
                exit 1
              fi
            done
            
            echo ""
            echo "Checking frontend service..."
            if docker ps --filter "name=frontend" --filter "status=running" | grep -q frontend; then
              echo "✓ Frontend is running"
            else
              echo "✗ Frontend is NOT running"
              docker ps -a | grep frontend || true
              exit 1
            fi
            
            echo ""
            echo "Checking API endpoint health..."
            API_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health 2>/dev/null || echo "000")
            
            if [ "$API_HEALTH" == "200" ]; then
              echo "✓ API is responding with health status 200"
            else
              echo "⚠ API responded with status: $API_HEALTH"
            fi
            
            echo ""
            echo "Checking frontend endpoint..."
            FRONTEND_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null || echo "000")
            
            if [ "$FRONTEND_HEALTH" == "200" ]; then
              echo "✓ Frontend is responding with status 200"
            else
              echo "⚠ Frontend responded with status: $FRONTEND_HEALTH"
            fi
            
            echo ""
            echo "=========================================="
            echo "✓ Deployment verification completed"
            echo "=========================================="
          VERIFY_SCRIPT

      - name: Generate deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed to** | ${{ secrets.EC2_HOST }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **AWS Region** | ${{ secrets.AWS_REGION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **ECR Repository** | ${{ secrets.AWS_REGISTRY }}/${{ secrets.AWS_REPOSITORY }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Services Deployed** | auth-service, customer-service, account-service, transaction-service, notification-service, frontend |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployment Status** | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
